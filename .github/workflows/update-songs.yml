name: Update song list

on:
  schedule:
    - cron: "3/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Diagnose DNS
        run: |
          echo "=== system resolver ==="
          getent ahostsv4 rei.monoteam.top || true

          echo "=== rei.monoteam.top ==="
          dig rei.monoteam.top || true

          echo "=== CNAME target ==="
          dig hk1-dns.starzv.com || true

          echo "=== Cloudflare DNS ==="
          dig @1.1.1.1 rei.monoteam.top || true

          echo "=== Google DNS ==="
          dig @8.8.8.8 rei.monoteam.top || true

          echo "=== curl ==="
          curl -v --connect-timeout 10 http://rei.monoteam.top/songs.php || true

      - name: Fetch song list
        run: node scripts/update-songs.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/songs.json

          if git diff --cached --quiet; then
            echo "歌单没有变化，无需提交"
            exit 0
          fi

          git commit -m "Update song list"
          git push